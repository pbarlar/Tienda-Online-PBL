name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      -  develop
  pull_request:
    branches:
      - main
      
jobs:
  # JOB 1: CONSTRUIR Y PUBLICAR IMAGEN
  # Este trabajo se encarga de crear el paquete Docker y subirlo a la "nube" de GitHub (GHCR)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Use user/repo:latest format (lowercase)
          tags: ghcr.io/${{ github.repository_owner }}/tienda-online:latest
          # Ensure no-cache to avoid previous issues
          no-cache: true

  # JOB 2: DESPLEGAR EN SERVIDOR
  # Este trabajo se conecta a tu máquina EC2 y le dice que descargue la nueva versión
  deploy:
    needs: build-and-push # Espera a que termine el anterior
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
          # Credenciales SSH
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22 # Puerto SSH por defecto (cámbialo si tu servidor usa otro)
          script: |
            # Parar contenedores antiguos si existen
            docker stop tienda-online || true
            docker rm tienda-online || true
            
            # Login en GHCR (usando token personal o el del workflow si se pasara, pero aquí es más fácil hacer pull público si el paquete es público)
            # OJO: Para repos privados/públicos en GHCR, a veces hace falta login. 
            # Simplificación: Asumimos que el repo es público O que el usuario configurará docker login en la máquina.
            # Alternativa robusta: Pasar el GITHUB_TOKEN al script (podría ser inseguro en logs) o hacer el repo público.
            
            echo "Descargando nueva imagen..."
            docker pull ghcr.io/${{ github.repository_owner }}/tienda-online:latest
            
            echo "Arrancando contenedor..."
            # Usamos el puerto 8085 y --name para evitar nombres aleatorios
            docker run -d --name tienda-online -p 80:80 --restart unless-stopped ghcr.io/${{ github.repository_owner }}/tienda-online:latest
            
            echo "Despliegue completado!"
