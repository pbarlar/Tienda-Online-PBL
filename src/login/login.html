<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>
        <form action="" id="form">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" placeholder="Tu nombre de usuario">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña">
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div id="captcha-container" class="hidden">
            <p>Introduce el siguiente texto para continuar:</p>
            <div id="captcha-display"></div>
            <input type="text" id="captcha-input" placeholder="Introduce el captcha">
            <button id="verify-captcha">Verificar</button>
        </div>
        <p class="register-link"><a href="register.html">¿No tienes cuenta? Registrate</a></p>
    </div>
    <script src="login.js"></script>
</body>

</html>
